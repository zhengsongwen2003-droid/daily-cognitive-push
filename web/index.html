<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e8">
    <title>每日认知训练</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="应用概览">
        <div>
          <p class="kicker">每日认知</p>
          <h1>用案例故事看懂人情与博弈</h1>
        </div>
        <div class="streak" aria-label="连续完成天数">
          <span id="streakDays">0</span>
          <small>连续</small>
        </div>
      </section>

      <nav class="tabs" aria-label="视图切换">
        <button class="tab is-active" type="button" data-view="today">今日</button>
        <button class="tab" type="button" data-view="review">复盘</button>
        <button class="tab" type="button" data-view="history">历史</button>
      </nav>

      <section class="view is-active" id="todayView">
        <article class="card lesson-card">
          <div class="card-head">
            <div>
              <p class="date-line" id="todayDate"></p>
              <h2 id="cardTitle"></h2>
            </div>
            <span class="time-chip">5 分钟</span>
          </div>

          <div class="theme-strip" id="themeStrip"></div>

          <section class="lesson-section">
            <h3>案例情景</h3>
            <div class="story-copy" id="caseText"></div>
          </section>

          <section class="analysis-section">
            <div class="section-title">
              <span>认知拆解</span>
              <strong>领导眼中的利益坐标系</strong>
            </div>
            <div class="analysis-list" id="analysisList"></div>
          </section>

          <section class="insight-section">
            <div class="section-title">
              <span>核心认知提升</span>
              <strong>把道德情绪换成局势判断</strong>
            </div>
            <div class="insight-list" id="insightList"></div>
          </section>

          <div class="question-box">
            <span>今日一问</span>
            <p id="questionText"></p>
          </div>

          <label class="reflection-label" for="reflectionInput">我的回答</label>
          <textarea id="reflectionInput" rows="5" placeholder="写下一个真实处境：谁在场、谁有资源、谁承担成本、谁获得收益。"></textarea>

          <div class="action-row">
            <button class="icon-button secondary" type="button" id="prevCard" title="上一期">‹</button>
            <button class="primary-button" type="button" id="saveReflection">保存今日记录</button>
            <button class="icon-button secondary" type="button" id="nextCard" title="下一期">›</button>
          </div>
        </article>

        <aside class="card action-card">
          <h2>10 分钟微行动</h2>
          <p id="actionText"></p>
          <button class="secondary-button" type="button" id="completeAction">标记完成</button>
        </aside>
      </section>

      <section class="view" id="reviewView">
        <article class="card">
          <div class="card-head">
            <div>
              <p class="date-line">本周复盘</p>
              <h2>把学过的局势判断用回生活里</h2>
            </div>
            <span class="time-chip" id="doneCount">0 次</span>
          </div>
          <div class="review-grid" id="reviewGrid"></div>
        </article>
      </section>

      <section class="view" id="historyView">
        <article class="card">
          <div class="card-head">
            <div>
              <p class="date-line">历史记录</p>
              <h2>你的认知训练轨迹</h2>
            </div>
            <button class="secondary-button compact" type="button" id="clearHistory">清空</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </article>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
